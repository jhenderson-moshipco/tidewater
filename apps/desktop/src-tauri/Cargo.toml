[package]
name = "tidewater"
version = "0.1.0"
description = "Open-source Postgres client"
license = "Apache-2.0"
edition = "2024"
rust-version = "1.85"

[lib]
name = "tidewater_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
argon2 = "0.6.0"
base64 = "0.23.1"
fernet = { version = "0.2.2", default-features = false, features = ["rustcrypto"] }
getrandom = "0.4.3"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-native-certs = "0.8.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2", features = [] }
thiserror = "2.0.21"
time = { version = "0.3.45", features = ["formatting", "macros"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
tokio-postgres = "0.7.18"
tokio-postgres-rustls = "0.14.0"
ts-rs = { version = "12.0.1", features = ["uuid-impl", "serde-compat"] }
url = "2.5.9"
uuid = { version = "1.26.1", features = ["v4"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6.3", features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6.3", features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6.3", features = ["sync-secret-service", "crypto-rust", "vendored"] }

[dev-dependencies]
tempfile = "3.27.0"
